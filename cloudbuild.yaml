steps:
  # Run unit tests
  - name: "python:3.12-slim"
    id: "test"
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install -r requirements.txt pytest --quiet
        python -m pytest tests/ -v

  # Build the container image
  - name: "gcr.io/cloud-builders/docker"
    id: "build"
    args:
      - build
      - "-t"
      - "gcr.io/$PROJECT_ID/pipeline-paramedic:$COMMIT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/pipeline-paramedic:latest"
      - "."
    waitFor: ["test"]

  # Push to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    id: "push"
    args:
      - push
      - "--all-tags"
      - "gcr.io/$PROJECT_ID/pipeline-paramedic"
    waitFor: ["build"]

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - pipeline-paramedic
      - "--image=gcr.io/$PROJECT_ID/pipeline-paramedic:$COMMIT_SHA"
      - "--region=us-central1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,GCP_LOCATION=us-central1"
      - "--set-secrets=GITLAB_TOKEN=gitlab-token:latest,GITLAB_WEBHOOK_SECRET=webhook-secret:latest,GEMINI_API_KEY=gemini-api-key:latest"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=10"
      - "--service-account=pipeline-paramedic-sa@pipeline-paramedic-497116.iam.gserviceaccount.com"
    waitFor: ["push"]

images:
  - "gcr.io/$PROJECT_ID/pipeline-paramedic:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/pipeline-paramedic:latest"

options:
  logging: CLOUD_LOGGING_ONLY
